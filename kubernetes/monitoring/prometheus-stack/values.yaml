prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - prometheus.home.lobotechworks.pt
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.home.lobotechworks.pt
  prometheusSpec:
    externalUrl: https://prometheus.home.lobotechworks.pt
    retention: 15d
    retentionSize: 20GiB
    resources:
      requests:
        memory: 900Mi
        cpu: 100m
      limits:
        memory: 1536Mi
        cpu: 1
    affinity: &preferNonControlPlane
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels: &prometheusInstance
        prometheus: kube-prometheus-stack
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels: *prometheusInstance
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels: *prometheusInstance
    probeSelectorNilUsesHelmValues: false
    probeSelector:
      matchLabels: *prometheusInstance
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigSelector:
      matchLabels: *prometheusInstance

kubeControllerManager:
  # Talos exposes this endpoint only on loopback.
  enabled: false

kubeScheduler:
  # Talos exposes this endpoint only on loopback.
  enabled: false

# Cilium replaces kube-proxy in this cluster.
kubeProxy:
  enabled: false

kubeEtcd:
  enabled: true

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - alertmanager.home.lobotechworks.pt
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.home.lobotechworks.pt
  alertmanagerSpec:
    externalUrl: https://alertmanager.home.lobotechworks.pt
    retention: 72h
    resources:
      requests:
        memory: 200Mi
        cpu: 10m
      limits:
        memory: 512Mi
        cpu: 200m
    affinity: *preferNonControlPlane
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    # Config comes from the self-managed alertmanager-config secret (see
    # alertmanager-discord-external-secret.yaml) instead of alertmanager.config
    # below, because prometheus-operator v0.90.1 doesn't recognize
    # discord_configs.webhook_url_file.
    useExistingSecret: true
    configSecret: alertmanager-config

grafana:
  grafana.ini:
    server:
      root_url: https://grafana.home.lobotechworks.pt
  # Recreate avoids the RWO rollout deadlock
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - grafana.home.lobotechworks.pt
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.home.lobotechworks.pt
  serviceMonitor:
    labels: *prometheusInstance
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  affinity: *preferNonControlPlane
  sidecar:
    resources:
      requests:
        memory: 96Mi
        cpu: 10m
      limits:
        memory: 192Mi
        cpu: 500m

commonLabels: *prometheusInstance

kube-state-metrics:
  prometheus:
    monitor:
      additionalLabels: *prometheusInstance
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 192Mi
      cpu: 200m
  affinity: *preferNonControlPlane

prometheus-node-exporter:
  prometheus:
    monitor:
      additionalLabels: *prometheusInstance
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpoint_node_name]
          targetLabel: instance
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 96Mi
      cpu: 500m

prometheusOperator:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 192Mi
      cpu: 200m
  affinity: *preferNonControlPlane
  prometheusConfigReloader:
    resources:
      requests:
        memory: 20Mi
        cpu: 10m
      limits:
        memory: 64Mi
        cpu: 100m
