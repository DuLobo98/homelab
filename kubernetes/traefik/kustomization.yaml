apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: "41.0.2"
    releaseName: traefik
    namespace: traefik
    valuesFile: values.yaml
    includeCRDs: true
    apiVersions:
      - policy/v1/PodDisruptionBudget
