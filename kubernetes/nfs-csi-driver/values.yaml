externalSnapshotter:
  enabled: false
feature:
  enableFSGroupPolicy: false

controller:
  replicas: 1
  resources:
    csiProvisioner:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 128Mi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 64Mi
    nfs:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 128Mi

node:
  resources:
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 64Mi
    nodeDriverRegistrar:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 64Mi
    nfs:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 128Mi
