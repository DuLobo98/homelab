apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfs-csi
resources:
  - namespace.yaml
  - storageclass.yaml
helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: "4.12.0"
    releaseName: csi-driver-nfs
    namespace: nfs-csi
    valuesFile: values.yaml
    includeCRDs: true
