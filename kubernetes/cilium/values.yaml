ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

l2announcements:
  enabled: true

hubble:
  enabled: true
  tls:
    auto:
      # Helm generates a new CA on every render, which is incompatible with
      # Argo CD reconciliation. Cilium's certgen job reuses cilium-ca instead.
      method: cronJob
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true

rollOutCiliumPods: true

operator:
  rollOutPods: true

k8sClientRateLimit:
  qps: 10
  burst: 20

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
