apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - main-load-balancer-ip-pool.yaml
  - main-l2-announcement-policy.yaml
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: "1.18.3"
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    includeCRDs: true
