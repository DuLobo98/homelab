apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - cliproxyapi.home.lobotechworks.pt
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: cliproxyapi
          port: 8317
          weight: 1
