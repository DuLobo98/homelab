apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-config
  namespace: cliproxyapi
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config.yaml: |
          config-version: 8
          server:
            host: ""
            port: 8317
            shutdown-timeout: 45
            trusted-proxies: []
            discovery:
              enabled: false
          management:
            # The internal Traefik Gateway serves the management UI; every request needs this key.
            allow-remote: true
            secret-key: ""
            disable-control-panel: false
            disable-auto-update-panel: true
          access:
            api-keys:
              - "{{ .apiKey }}"
          oauth:
            auth-dir: /data
        management-password: "{{ .managementKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: cliproxyapi/api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: managementKey
      remoteRef:
        key: cliproxyapi/management_key
        conversionStrategy: Default
        decodingStrategy: None
