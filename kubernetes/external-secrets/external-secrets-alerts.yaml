apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: external-secrets
  labels:
    prometheus: kube-prometheus-stack
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretsOnePasswordStoreNotReady
          expr: clustersecretstore_status_condition{name="onepassword",condition="Ready",status="False"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 1Password External Secrets store is not ready
            description: The onepassword ClusterSecretStore has been unavailable for at least five minutes. Check its status and the External Secrets controller logs for provider errors, including 1Password rate limits.
