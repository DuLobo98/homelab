apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-credentials
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: technitium-credentials
    creationPolicy: Owner
  data:
    - secretKey: tsig-keyname
      remoteRef:
        key: technitium/externaldns_tsig_keyname
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tsig-secret
      remoteRef:
        key: technitium/externaldns_tsig_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
