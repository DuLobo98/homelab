[project]
site_name = "Lobo Tech Works Homelab"
site_description = "Infrastructure, operations, and recovery documentation."
site_url = "https://dulobo98.github.io/homelab/"
repo_url = "https://github.com/DuLobo98/homelab"
repo_name = "DuLobo98/homelab"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "Foundations" = [
    { "Inventory" = "inventory.md" },
    { "Operator tooling" = "reference/operator-tooling.md" },
    { "GitOps delivery" = "reference/gitops.md" },
    { "Networking and traffic" = "reference/networking.md" },
    { "Storage and data protection" = "reference/storage.md" },
    { "Observability" = "reference/observability.md" },
  ] },
  { "Services" = [
    { "Platform" = "services/platform.md" },
    { "Applications" = "services/applications.md" },
  ] },
  { "Operations" = [
    { "Bootstrap" = "bootstrap.md" },
    { "Health checks" = "operations/health-checks.md" },
    { "Tailscale service sharing" = "operations/tailscale-service-sharing.md" },
    { "Alerting" = "operations/alerting.md" },
    { "Backups and recovery" = "operations/backups-and-recovery.md" },
    { "Runbooks" = [
      { "External Secrets store unavailable" = "operations/runbooks/external-secrets-store.md" },
      { "Argo CD application failure" = "operations/runbooks/argocd-application.md" },
      { "Prometheus alert" = "operations/runbooks/prometheus-alert.md" },
    ] },
    { "Post-incident reviews" = [
      { "PIR template" = "operations/post-incident-reviews/pir-template.md" },
    ] },
  ] },
  { "Decisions" = [
    { "ADR template" = "decisions/adr-template.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "search.share",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use system preference"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
