version: "3"

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  op:generate:
    desc: Inject all 1Password templates (*.op.tpl → same name without .op.tpl).
    silent: true
    preconditions:
      - sh: command -v op >/dev/null 2>&1
        msg: "1Password CLI (op) is required to inject secrets"
    cmds:
      - |
        set -euo pipefail

        templates=$(find . -name '*.op.tpl')
        if [ -z "$templates" ]; then
          echo "No 1Password templates found under ." >&2
          exit 0
        fi
        for template in $templates; do
          output="${template%.op.tpl}"
          op inject -i "$template" -o "$output" -f
          echo "Injected $template → $output"
        done

  talos:config:
    desc: Generate .talosconfig/config from the Talos client config stored in 1Password.
    silent: true
    preconditions:
      - sh: command -v op >/dev/null 2>&1
        msg: "1Password CLI (op) is required"
    cmds:
      - |
        set -euo pipefail

        mkdir -p .talosconfig
        op read "op://homelab/talosconfig-k8s-prod/notesPlain" > .talosconfig/config
        chmod 600 .talosconfig/config
        echo ".talosconfig/config generated."

  talos:kubeconfig:
    desc: Generate kubeconfig from the cluster into .kubeconfig/config via talosctl.
    silent: true
    preconditions:
      - sh: command -v talosctl >/dev/null 2>&1
        msg: "talosctl is required"
    cmds:
      - |
        set -euo pipefail

        NODE="192.168.1.211"
        mkdir -p .kubeconfig
        talosctl kubeconfig .kubeconfig/config --nodes "${NODE}" --endpoints "${NODE}" --force
        chmod 600 .kubeconfig/config
        echo ".kubeconfig/config generated."

  k8s:bootstrap:
    desc: Install Cilium and Argo CD after Talos is ready, then hand control to Argo CD.
    silent: true
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: "kubectl is required"
      - sh: command -v kustomize >/dev/null 2>&1
        msg: "kustomize is required"
      - sh: command -v helm >/dev/null 2>&1
        msg: "helm is required by kustomize's Helm chart generator"
      - sh: command -v op >/dev/null 2>&1
        msg: "1Password CLI (op) is required"
      - sh: command -v talosctl >/dev/null 2>&1
        msg: "talosctl is required"
    cmds:
      - task: talos:config
      - task: talos:kubeconfig
      - |
        set -euo pipefail

        REPO_ROOT="{{.ROOT_DIR}}"
        export KUBECONFIG="$REPO_ROOT/.kubeconfig/config"
        OP_TOKEN="$(op read "op://homelab/1password/sa_token")"

        echo "Checking the Kubernetes API..."
        kubectl get --raw=/readyz >/dev/null

        echo "Installing Cilium..."
        kustomize build "$REPO_ROOT/kubernetes/cilium" --enable-helm |
          kubectl apply --server-side --field-manager=argocd-controller --force-conflicts -f -
        kubectl rollout status daemonset/cilium --namespace kube-system --timeout=10m
        kubectl rollout status deployment/cilium-operator --namespace kube-system --timeout=10m

        echo "Configuring the 1Password token for External Secrets Operator..."
        kubectl apply -f "$REPO_ROOT/kubernetes/external-secrets/namespace.yaml"
        kubectl create secret generic onepassword-token \
          --namespace external-secrets \
          --from-literal=token="$OP_TOKEN" \
          --dry-run=client -o yaml |
          kubectl apply --server-side --field-manager=argocd-controller --force-conflicts -f -
        unset OP_TOKEN

        echo "Installing Argo CD..."
        kubectl apply -f "$REPO_ROOT/kubernetes/argocd/namespace.yaml"
        helm template argocd argo-cd \
          --repo https://argoproj.github.io/argo-helm \
          --version "9.1.3" \
          --namespace argocd \
          --include-crds \
          --values "$REPO_ROOT/kubernetes/argocd/values.yaml" |
          kubectl apply --server-side --field-manager=argocd-controller --force-conflicts -f -
        kubectl wait --for=condition=established crd/applications.argoproj.io --timeout=2m
        kubectl rollout status deployment/argocd-server --namespace argocd --timeout=5m

        echo "Starting the app-of-apps reconciliation..."
        kubectl apply --server-side --field-manager=argocd-controller --force-conflicts \
          -f "$REPO_ROOT/kubernetes/argocd/root.yaml"
        kubectl wait --for=create secret/argocd-initial-admin-secret --namespace argocd --timeout=2m

        echo "Bootstrap complete."

  hosts:add:*:*:
    desc: Add a URL entry to /etc/hosts for the ingress VIP. Use hosts:add:[APPNAME]:[DOMAIN]
    silent: true
    vars:
      APPNAME: "{{ index .MATCH 0}}"
      DOMAIN: "{{ index .MATCH 1}}"
    cmds:
      - |
        set -euo pipefail

        echo "Adding ingress host entry to /etc/hosts..."
        sudo sh -c 'echo "192.168.1.200 {{.DOMAIN}} {{.APPNAME}}" >> /etc/hosts'
        echo "Host entry added to /etc/hosts."

  monitoring:dashboards:add:*:*:
    desc: Download a new Grafana dashboard from grafana.com. Use monitoring:dashboards:add:[APP]:[GNET_ID]
    silent: true
    vars:
      APP: "{{ index .MATCH 0 }}"
      GNET_ID: "{{ index .MATCH 1 }}"
    cmds:
      - |
        set -euo pipefail

        DEST_DIR="kubernetes/monitoring/prometheus-stack/dashboards/generated/{{.APP}}"
        DEST_FILE="$DEST_DIR/{{.APP}}.json"
        mkdir -p "$DEST_DIR"
        echo "Downloading dashboard {{.GNET_ID}} from grafana.com..."
        curl -fsS "https://grafana.com/api/dashboards/{{.GNET_ID}}/revisions/latest/download" | jq 'del(.id)' > "$DEST_FILE"
        echo "Saved to $DEST_FILE"

  monitoring:dashboards:update:
    desc: Refresh generated Grafana dashboards under kubernetes/monitoring/prometheus-stack/dashboards/generated from grafana.com
    silent: true
    cmds:
      - |
        set -euo pipefail

        DASHBOARDS_DIR="kubernetes/monitoring/prometheus-stack/dashboards/generated"
        find "$DASHBOARDS_DIR" -name '*.json' | while read -r file; do
          gnet_id=$(jq -r '.gnetId // empty' "$file")
          if [ -z "$gnet_id" ]; then
            echo "Skipping $file (no gnetId field)"
            continue
          fi
          echo "Updating $file from grafana.com dashboard $gnet_id..."
          curl -fsS "https://grafana.com/api/dashboards/$gnet_id/revisions/latest/download" | jq 'del(.id)' > "$file"
        done
        echo "Dashboards updated."
